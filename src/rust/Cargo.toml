[package]
name = "alchemy-logging"
# Sentinel value overwritten with the real version (derived from the git tag)
# during the release build. See the `release` stage in ./Dockerfile.
version = "0.0.0"
edition = "2021"
rust-version = "1.71"
description = "Multi-language logging framework with configurable channels and levels"
license = "MIT"
repository = "https://github.com/IBM/alchemy-logging"
readme = "README.md"
keywords = ["logging", "log", "alog"]
categories = ["development-tools::debugging"]

[lib]
name = "alog"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Strips every logging macro down to a no-op at compile time. See the note
# at the top of src/lib.rs for exactly what this does and does not cover.
disable-logging = []

[dev-dependencies]
